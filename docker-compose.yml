services:
  postgres:
    image: postgres:15-alpine
    container_name: vikling_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vikling_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vikling_redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-5001}:6379"
    volumes:
      - redis_data:/data
    networks:
      - vikling_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vikling_backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-7005}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5000}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-5001}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${PORT:-7005}:7005"
    volumes:
      - ./uploads:/app/uploads
      - ./whisper-bin:/app/whisper-bin
      - ./whisper-models:/app/whisper-models
    networks:
      - vikling_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vikling_network:
    driver: bridge
