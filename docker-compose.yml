services:
  postgres:
    image: postgres:15-alpine
    container_name: vikling_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vikling_network

  redis:
    image: redis:7-alpine
    container_name: vikling_redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-5001}:6379"
    volumes:
      - redis_data:/data
    networks:
      - vikling_network

volumes:
  postgres_data:
  redis_data:

networks:
  vikling_network:
    driver: bridge
